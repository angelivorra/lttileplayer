# Configuración de lttileplayer (generada por lgpt_setup.py).
# Los argumentos de línea de comandos tienen prioridad.

songs_dir = "/home/angel/Documentos/canciones/"

[audio]
output = "IQaudIODAC"
samplerate = 44100
blocksize = 512
delay = 1.0
record = ""
stream = 5050

[midi]
input = "LPD8"
output = "Midi Through"

[channels]
# Canales silenciados siempre (índice 0-7; 3 = pista 4).
mute = [3, 4, 5, 6, 7]

[buttons]
# Botones del controlador: "note:canal:nota" o "cc:canal:control",
# "" = sin asignar.
up = "note:9:40"
down = "note:9:36"
play = "note:9:41"
stop = "note:9:37"

[pots]
# Potenciómetros: cc = "cc:canal:control" (capturado aquí),
# target = "canal:parametro" (canal LGPT 0-7; parametro:
# lp_cutoff, lp_res, volume, pan, pitch; "" = sin asignar).
pot1 = { cc = "cc:0:70", target = "2:suboctave" }
pot2 = { cc = "cc:0:71", target = "5:satan" }
pot3 = { cc = "cc:0:72", target = "" }
pot4 = { cc = "cc:0:73", target = "" }
pot5 = { cc = "cc:0:74", target = "2:acid_lp" }
pot6 = { cc = "cc:0:75", target = "5:acid_lp" }
pot7 = { cc = "cc:0:76", target = "" }
pot8 = { cc = "cc:0:77", target = "" }
