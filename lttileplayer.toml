# Configuración de lttileplayer (generada por lgpt_setup.py).
# Los argumentos de línea de comandos tienen prioridad.

songs_dir = "/home/angel/Documentos/canciones/"

[audio]
output = ""
samplerate = 44100
blocksize = 512
delay = 1.0

[midi]
input = "Minilab3:Minilab3 MIDI 28:0"
output = "Midi Through:Midi Through Port-0 14:0"

[buttons]
# Botones del controlador: "note:canal:nota" o "cc:canal:control",
# "" = sin asignar.
up = "note:9:37"
down = "note:9:36"
accept = "note:9:38"
play = "note:9:41"
stop = "note:9:40"

[pots]
# Potenciómetros del controlador: "cc:canal:control",
# "" = sin asignar.
# Si todos están vacíos se usa el mapeo CC por defecto (1/7/10/20).
cutoff = ""
volume = ""
pan = ""
pitch = ""
